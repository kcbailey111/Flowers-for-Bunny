<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Flowers for Bunny 💗💚</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #toggle {
    position: fixed; bottom: 14px; right: 14px; z-index: 2;
    background: transparent; border: 1px solid #FF91A455; color: #FFB6C1;
    font: 13px "Courier New", monospace; padding: 6px 12px; border-radius: 20px; cursor: pointer;
  }
  #note {
    position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 10px);
    max-width: min(90vw, 460px); text-align: center; pointer-events: none;
    font: 15px/1.55 Georgia, serif; color: #F0EAD6; opacity: 0;
    transition: opacity 1.6s ease, transform 1.6s ease;
    text-shadow: 0 0 10px #000, 0 0 4px #000;
    background: #000000c8; padding: 10px 16px; border-radius: 12px;
  }
  #note.show { opacity: 1; transform: translate(-50%, 0); }
  #note .aka { color: #FF91A4; letter-spacing: .35em; }
  #note .ivy { color: #8DB600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="note">
  <div class="aka">SKEE-WEE! · ΑΚΑ</div>
  For my beautiful Bunny: pink tea roses for my Pretty Pearl,<br>
  <span class="ivy">ivy that grows as strong as you.</span><br>
  Service to all mankind, and all my love to you. 💗💚
</div>
<button id="toggle">♡ note</button>
<script>
(() => {
  const RAMP = " .:-=+*#%@";
  const PALETTES = [
    ["#E75480", "#F88379", "#FF91A4", "#FFB6C1"],   // salmon pink roses
    ["#2E6F40", "#4C9A2A", "#76B947", "#8DB600"],   // apple green ivy
    ["#F0EAD6", "#F0EAD6", "#FFFDF9", "#FFFDF9"],   // pearls
  ];
  const PEARL_CHARS = "*O@";
  const ROSE = 0, LEAF = 1, PEARL = 2;

  // ---------- scene construction ----------
  const pts = [];  // x,y,z,nx,ny,nz,type,phase
  const add = (p, n, type) => pts.push(p[0], p[1], p[2], n[0], n[1], n[2], type, Math.random() * 6.283);

  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const rotX = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; };
  const rotZ = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]]; };

  function surface(f, u0, u1, nu, v0, v1, nv, type, xf) {
    const e = 1e-3;
    for (let i = 0; i < nu; i++) {
      const u = u0 + (u1 - u0) * i / (nu - 1);
      for (let j = 0; j < nv; j++) {
        const v = v0 + (v1 - v0) * j / (nv - 1);
        const p = f(u, v);
        const n = norm(cross(sub(f(u + e, v), p), sub(f(u, v + e), p)));
        add(xf(p, false), xf(n, true), type);
      }
    }
  }

  // Paul Nylander's parametric rose (y is up)
  function rose(x1, th) {
    const phi = (Math.PI / 2) * Math.exp(-th / (8 * Math.PI));
    const m = ((3.6 * th) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    const X = 1 - 0.5 * Math.pow(1.25 * Math.pow(1 - m / Math.PI, 2) - 0.25, 2);
    const y = 1.95653 * x1 * x1 * Math.pow(1.27689 * x1 - 1, 2) * Math.sin(phi);
    const r = X * (x1 * Math.sin(phi) + y * Math.cos(phi));
    const h = X * (x1 * Math.cos(phi) - y * Math.sin(phi));
    return [r * Math.sin(th), h, r * Math.cos(th)];
  }

  const placed = (o, s, tx, tz) => (p, isN) => {
    const q = rotZ(rotX(p, tx), tz);
    return isN ? q : [q[0] * s + o[0], q[1] * s + o[1], q[2] * s + o[2]];
  };

  function tube(a, b, r, type) {
    const d = sub(b, a), dn = norm(d);
    const side = norm(cross(dn, Math.abs(dn[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
    const up = cross(dn, side);
    for (let i = 0; i < 50; i++) {
      const t = i / 49, c = [a[0] + d[0] * t, a[1] + d[1] * t, a[2] + d[2] * t];
      for (let j = 0; j < 8; j++) {
        const g = j / 8 * 6.283;
        const n = [0, 1, 2].map(k => side[k] * Math.cos(g) + up[k] * Math.sin(g));
        add([c[0] + n[0] * r, c[1] + n[1] * r, c[2] + n[2] * r], n, type);
      }
    }
  }

  // Five-lobed ivy leaf in polar form, cupped slightly
  function ivy(base, dir, size) {
    const dn = norm(dir);
    const side = norm(cross(dn, Math.abs(dn[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]));
    const nrm = cross(side, dn);
    for (let i = 0; i < 70; i++) {
      const th = i / 70 * 6.283;
      const lobes = 0.55 + 0.45 * Math.pow(Math.abs(Math.cos(2.5 * th)), 0.7);
      const R = size * lobes * (0.75 + 0.25 * Math.cos(th));
      for (let s = 0.08; s <= 1; s += 0.09) {
        const a = Math.cos(th) * R * s, b = Math.sin(th) * R * s;
        const cup = 0.25 * size * s * s;
        add([0, 1, 2].map(k => base[k] + dn[k] * (a + size * 0.9) + side[k] * b + nrm[k] * cup), nrm, LEAF);
      }
    }
  }

  function sphere(c, r, type) {
    for (let i = 0; i < 10; i++) {
      const v = Math.PI * (i + 0.5) / 10;
      for (let j = 0; j < 16; j++) {
        const u = j / 16 * 6.283;
        const n = [Math.sin(v) * Math.cos(u), Math.cos(v), Math.sin(v) * Math.sin(u)];
        add([c[0] + n[0] * r, c[1] + n[1] * r, c[2] + n[2] * r], n, type);
      }
    }
  }

  const gather = [0, -1.0, 0];
  const blooms = [
    [[0.0, 1.45, 0.0], 0.78, -0.25, 0.0],
    [[-1.0, 0.95, 0.3], 0.62, -0.25, 0.4],
    [[1.0, 0.95, 0.3], 0.62, -0.25, -0.4],
    [[-0.5, 0.75, -0.75], 0.56, 0.35, 0.25],
    [[0.55, 0.8, -0.7], 0.56, 0.35, -0.25],
    [[0.0, 0.55, 0.85], 0.5, -0.55, 0.0],
    [[-1.35, 0.35, -0.2], 0.42, 0.1, 0.8],
    [[1.35, 0.35, -0.2], 0.42, 0.1, -0.8],
  ];
  for (const [o, s, tx, tz] of blooms) {
    surface(rose, 0, 1, 22, -2 * Math.PI, 15 * Math.PI, 380, ROSE, placed(o, s, tx, tz));
    tube(o, gather, 0.03, LEAF);
  }
  tube(gather, [0, -2.4, 0], 0.11, LEAF);

  // ring of interlocking ivy framing the roses, plus trailing vines
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * 6.283, h = 0.15 + 0.35 * Math.sin(i * 1.7);
    const base = [Math.cos(a) * 0.55, h, Math.sin(a) * 0.55];
    ivy(base, [Math.cos(a), 0.25 + 0.3 * Math.cos(i * 2.3), Math.sin(a)], 0.42 + 0.08 * Math.sin(i * 3.1));
  }
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * 6.283 + 0.4;
    for (let k = 0; k < 3; k++) {
      const base = [Math.cos(a) * (0.9 + k * 0.35), -0.3 - k * 0.55, Math.sin(a) * (0.9 + k * 0.35)];
      ivy(base, [Math.cos(a + k), -0.5, Math.sin(a + k)], 0.28);
    }
  }

  // strand of 20 pearls spiraling through the bouquet
  for (let i = 0; i < 20; i++) {
    const t = i / 19;
    const a = t * 6.283 * 1.6;
    const r = 1.25 - 0.35 * Math.sin(t * Math.PI);
    sphere([Math.cos(a) * r, 0.95 - t * 1.3 + 0.15 * Math.sin(a * 2), Math.sin(a) * r], 0.045, PEARL);
  }

  const P = new Float32Array(pts);
  const N = P.length / 8;

  // ---------- rendering ----------
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let cols, rows, cw, ch, fs, scale, dpr;
  let zbuf, cellChar, cellColor, cellType;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = innerWidth, h = innerHeight;
    fs = Math.max(6, Math.min(14, Math.min(w / (110 * 0.6), h / 78)));
    cw = fs * 0.6; ch = fs * 0.92;
    cols = Math.floor(w / cw); rows = Math.floor(h / ch);
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `bold ${fs}px "JetBrains Mono", Consolas, "Courier New", monospace`;
    ctx.textBaseline = "top";
    scale = Math.min(h * 0.86 / 4.9, w * 0.9 / 4.4) * 7;
    zbuf = new Float32Array(cols * rows);
    cellChar = new Uint8Array(cols * rows);
    cellColor = new Uint8Array(cols * rows);
    cellType = new Uint8Array(cols * rows);
  }
  addEventListener("resize", resize);
  resize();

  const L = norm([-0.45, 0.7, -0.55]);
  const K2 = 7;

  let dragX = 0, dragY = 0, targetX = 0, targetY = 0, dragging = false, lastX = 0, lastY = 0;
  cv.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => {
    if (!dragging) return;
    targetY = Math.max(-1.2, Math.min(1.2, targetY + (e.clientX - lastX) * 0.008));
    targetX = Math.max(-0.4, Math.min(0.4, targetX + (e.clientY - lastY) * 0.004));
    lastX = e.clientX; lastY = e.clientY;
  });
  const release = () => { dragging = false; };
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);

  function frame(ms) {
    const t = ms / 1000;
    if (!dragging) { targetX *= 0.97; targetY *= 0.985; }
    dragX += (targetX - dragX) * 0.12;
    dragY += (targetY - dragY) * 0.12;

    const ay = 0.55 * Math.sin(t * 0.35) + t * 0.12 + dragY;
    const ax = 0.12 + 0.06 * Math.sin(t * 0.6) + dragX;
    const az = 0.04 * Math.sin(t * 0.45);
    const cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax), cz = Math.cos(az), sz = Math.sin(az);

    zbuf.fill(0); cellType.fill(255);
    const halfW = cols * cw / 2, halfH = rows * ch * 0.4;

    for (let i = 0; i < N; i++) {
      const o = i * 8;
      // rotate around Y, then X, then Z
      let x = P[o], y = P[o + 1] - 0.1, z = P[o + 2];
      let x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      let y2 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
      let x3 = x1 * cz - y2 * sz, y3 = x1 * sz + y2 * cz;
      const ooz = 1 / (z2 + K2);
      const c = Math.floor((halfW + scale * x3 * ooz) / cw);
      const r = Math.floor((halfH - scale * y3 * ooz) / ch);
      if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
      const idx = r * cols + c;
      if (ooz <= zbuf[idx]) continue;
      zbuf[idx] = ooz;

      let nx = P[o + 3], ny = P[o + 4], nz = P[o + 5];
      let n1 = nx * cy + nz * sy, nz1 = -nx * sy + nz * cy;
      let ny2 = ny * cx - nz1 * sx, nz2 = ny * sx + nz1 * cx;
      let nx3 = n1 * cz - ny2 * sz, ny3 = n1 * sz + ny2 * cz;
      let lum = Math.abs(nx3 * L[0] + ny3 * L[1] + nz2 * L[2]);
      const type = P[o + 6];
      if (type === ROSE) lum = lum * 0.9 + 0.12 * Math.sin(t * 2.6 + P[o + 7] + P[o] * 3 + P[o + 1] * 2);
      else if (type === PEARL) lum = 0.55 + 0.45 * lum;
      lum = Math.max(0.08, Math.min(0.999, lum));

      cellType[idx] = type;
      cellColor[idx] = Math.floor(lum * 4);
      cellChar[idx] = type === PEARL ? Math.floor(lum * 3) : 1 + Math.floor(lum * (RAMP.length - 1));
    }

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, cv.width, cv.height);
    // batch by color to minimize fillStyle changes
    for (let type = 0; type < 3; type++) {
      if (type === PEARL) { ctx.shadowColor = "#FFFDF9"; ctx.shadowBlur = fs * 0.9; }
      for (let shade = 0; shade < 4; shade++) {
        ctx.fillStyle = PALETTES[type][shade];
        for (let idx = 0; idx < cellType.length; idx++) {
          if (cellType[idx] !== type || cellColor[idx] !== shade) continue;
          const ch_ = type === PEARL ? PEARL_CHARS[cellChar[idx]] : RAMP[cellChar[idx]];
          ctx.fillText(ch_, (idx % cols) * cw, Math.floor(idx / cols) * ch);
        }
      }
      ctx.shadowBlur = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const note = document.getElementById("note");
  setTimeout(() => note.classList.add("show"), 2500);
  document.getElementById("toggle").addEventListener("click", () => note.classList.toggle("show"));
})();
</script>
</body>
</html>
